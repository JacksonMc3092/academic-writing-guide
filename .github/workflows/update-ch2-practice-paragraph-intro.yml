name: Update Chapter 2 Practice Paragraph Intro

on:
  push:
    branches:
      - main
    paths:
      - .sc-triggers/update-ch2-practice-paragraph-intro.txt

permissions:
  contents: write

jobs:
  edit-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4

      - name: Update student-facing language
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('1010/chapter-2.html')
          text = path.read_text(encoding='utf-8')
          old = 'The following original Scholar’s Compass practice paragraph is designed to show how several annotation moves can work together without relying on an invented outside source.'
          new = 'The following paragraph is designed to show how several annotation moves can work together without relying on an invented outside source.'

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target sentence; found {text.count(old)}')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          updated = path.read_text(encoding='utf-8')
          assert old not in updated
          assert new in updated
          assert '<h3>Practice paragraph</h3>' in updated
          assert '<h3>Possible annotations</h3>' in updated
          PY

      - name: Commit verified chapter edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1010/chapter-2.html
          git commit -m "Revise Chapter 2 practice paragraph introduction"
          git push origin HEAD:main
