name: Remove Chapter 1 Video Production Note

on:
  push:
    branches:
      - main
    paths:
      - .sc-triggers/remove-ch1-video-production-note.txt

permissions:
  contents: write

jobs:
  edit-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4

      - name: Remove student-facing production note
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('1010/chapter-1.html')
          text = path.read_text(encoding='utf-8')
          old = '<h3>Video: Active Reading Strategies</h3><p>The revised HTML chapter will embed the instructor-selected video below using a responsive player, provided YouTube permits external embedding. A direct viewing link will remain beneath the player as an accessibility and reliability fallback.</p>'

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one production-note block; found {text.count(old)}')

          text = text.replace(old, '', 1)
          path.write_text(text, encoding='utf-8')

          updated = path.read_text(encoding='utf-8')
          assert 'Video: Active Reading Strategies' not in updated
          assert 'The revised HTML chapter will embed the instructor-selected video below' not in updated
          assert 'CFT83pPike4' in updated
          assert 'As you watch, record:' in updated
          PY

      - name: Commit verified chapter edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1010/chapter-1.html
          git commit -m "Remove Chapter 1 video production note"
          git push origin HEAD:main
